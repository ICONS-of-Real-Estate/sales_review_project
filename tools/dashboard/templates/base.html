<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sales Review Dashboard{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0; padding: 2rem; max-width: 960px; margin-inline: auto;
      background: #0f1420; color: #e8ecf4;
    }
    a { color: #7dc4ff; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; color: #c7cee0; }
    .freshness {
      display: inline-block; padding: 0.2rem 0.7rem; border-radius: 999px;
      font-size: 0.8rem; margin-bottom: 1.5rem;
    }
    .freshness.ok { background: #143a2a; color: #7be0a8; }
    .freshness.warn { background: #4a3a12; color: #f2c14e; }
    .freshness.stale { background: #4a1414; color: #f28b8b; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { text-align: left; padding: 0.55rem 0.9rem; border-bottom: 1px solid #262c3d; vertical-align: top; }
    .clamp-text {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
      overflow: hidden; line-height: 1.4;
    }
    .toc ul {
      list-style: none; margin: 0.5rem 0 0; padding: 0;
      display: flex; flex-wrap: wrap; gap: 0.4rem 1rem;
    }
    .toc li {
      background: #161c2b; border-radius: 6px; padding: 0.3rem 0.7rem;
    }
    .toc a { text-decoration: none; }
    th {
      color: #9aa4bb; font-weight: 600; font-size: 0.78rem;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    tbody tr:hover { background: #161c2b; }
    .stat-row { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat {
      background: #161c2b; border-radius: 10px; padding: 1rem 1.5rem; min-width: 140px;
      display: block; text-decoration: none; color: inherit;
    }
    a.stat:hover { background: #1c2333; }
    .stat .value { font-size: 1.8rem; font-weight: 700; }
    .stat .label { font-size: 0.78rem; color: #9aa4bb; margin-top: 0.15rem; }
    .stat.warn .value { color: #f2c14e; }
    .muted { color: #9aa4bb; }
    nav.dashboard-nav { margin-bottom: 1.5rem; }
    nav.dashboard-nav a {
      color: #9aa4bb; text-decoration: none; margin-right: 1.5rem;
      font-size: 0.9rem; padding-bottom: 0.25rem; border-bottom: 2px solid transparent;
    }
    nav.dashboard-nav a.active { color: #e8ecf4; border-bottom-color: #7dc4ff; }
    .chart-card {
      background: #161c2b; border-radius: 10px; padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .chart-card h2 { margin: 0 0 1rem; font-size: 1rem; color: #c7cee0; }
    .playbook-body { line-height: 1.6; }
    .playbook-body blockquote {
      border-left: 3px solid #262c3d; margin: 0.75rem 0; padding: 0.25rem 1rem;
      color: #9aa4bb;
    }
    .playbook-body code { background: #0f1420; padding: 0.1rem 0.35rem; border-radius: 4px; }
    .playbook-body table { margin: 0.75rem 0; }
    .playbook-body hr { border: none; border-top: 1px solid #262c3d; margin: 1.5rem 0; }
    .playbook-body h3 { color: #e8ecf4; }
    .review-card {
      background: #161c2b; border-radius: 14px; padding: 2rem; max-width: 640px;
    }
    .review-remaining { font-size: 0.8rem; color: #9aa4bb; margin-bottom: 0.75rem; }
    .review-category {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: #9aa4bb;
    }
    .review-noise { color: #f2c14e; }
    .review-actions { display: flex; gap: 1rem; margin-top: 1.75rem; }
    .review-btn {
      flex: 1; font-size: 1.15rem; font-weight: 700; padding: 1.1rem;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .review-btn-green { background: #1e7d46; color: #eafff2; }
    .review-btn-green:hover { background: #249456; }
    .review-btn-red { background: #8f2323; color: #ffecec; }
    .review-btn-red:hover { background: #a82929; }
    .review-toggle { margin-bottom: 1.25rem; font-size: 0.9rem; }
    .review-toggle a { margin-right: 1rem; }
    .review-toggle a.active { color: #e8ecf4; font-weight: 600; }
    .review-history-message {
      background: #161c2b; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1.25rem;
    }
    .review-undo-btn {
      background: #262c3d; color: #e8ecf4; border: none; border-radius: 6px;
      padding: 0.35rem 0.8rem; cursor: pointer; font-size: 0.85rem;
    }
    .review-undo-btn:hover { background: #333b52; }
  </style>
</head>
<body>
  <nav class="dashboard-nav" style="display:flex; justify-content: space-between; align-items: baseline;">
    <div>
      <a href="/" class="{{ 'active' if active_page == 'overview' else '' }}">Overview</a>
      <a href="/charts" class="{{ 'active' if active_page == 'charts' else '' }}">Charts</a>
      <a href="/training" class="{{ 'active' if active_page == 'training' else '' }}">Training</a>
      <a href="/queue" class="{{ 'active' if active_page == 'queue' else '' }}">Review queue</a>
      <a href="/review" class="{{ 'active' if active_page == 'review' else '' }}">Review</a>
      <a href="/review/history">History</a>
      <a href="/calls" class="{{ 'active' if active_page == 'calls' else '' }}">Calls</a>
    </div>
    {% if user_email %}
    <div class="muted" style="font-size: 0.85rem;">
      {{ user_email }} · <a href="/logout" style="color:#9aa4bb;">Log out</a>
    </div>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
